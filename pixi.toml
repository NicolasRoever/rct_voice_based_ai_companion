[workspace]
name = "npj-medicine-replication"
version = "1.0.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = "2.3.5.*"
pandas = "3.0.0.*"
scipy = "1.17.0.*"
statsmodels = "0.14.6.*"
matplotlib-base = "3.10.8.*"
seaborn = "0.13.2.*"
pytask = "0.5.8.*"
pytest = "8.*"
ruff = "0.15.*"

[pypi-dependencies]
npj-medicine-replication = { path = ".", editable = true }
pystout = "==0.0.8"

[activation.env]
MPLBACKEND = "Agg"
MPLCONFIGDIR = ".cache/matplotlib"
XDG_CACHE_HOME = ".cache"

[tasks]
replicate = "pytask"
test = "pytest -q"
check = { depends-on = ["replicate", "test"] }
