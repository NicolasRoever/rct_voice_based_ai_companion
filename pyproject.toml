[project]
name = "npj-medicine-replication"
version = "1.0.0"
description = "Replication of the two-week Sonia randomised trial manuscript"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replication"]

[tool.pytask.ini_options]
paths = ["src/replication"]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore:invalid escape sequence:SyntaxWarning:pystout",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

